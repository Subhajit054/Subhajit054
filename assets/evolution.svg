<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="430"
     viewBox="0 0 1200 430">

  <defs>

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#03050b"/>
      <stop offset="45%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05070d"/>

    </linearGradient>

    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#9df7ff"/>
      <stop offset="35%" stop-color="#00dfff"/>
      <stop offset="70%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#061329"/>
    </radialGradient>

    <linearGradient id="cyanLine">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#00eaff"/>
    </linearGradient>

    <linearGradient id="purpleLine">
      <stop offset="0%" stop-color="#6c4cff"/>
      <stop offset="50%" stop-color="#ff4fd8"/>
      <stop offset="100%" stop-color="#6c4cff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <pattern id="grid"
             width="45"
             height="45"
             patternUnits="userSpaceOnUse">

      <path d="M45 0H0V45"
            fill="none"
            stroke="#17243a"
            stroke-width="1"
            opacity=".45"/>

    </pattern>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200"
        height="430"
        rx="24"
        fill="url(#bg)"/>

  <rect width="1200"
        height="430"
        rx="24"
        fill="url(#grid)"/>


  <!-- AMBIENT LIGHT -->

  <circle cx="600"
          cy="215"
          r="120"
          fill="#007cff"
          opacity=".09"
          filter="url(#bigGlow)">

    <animate attributeName="r"
             values="100;145;100"
             dur="4s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".04;.13;.04"
             dur="4s"
             repeatCount="indefinite"/>

  </circle>


  <!-- TOP SYSTEM LABEL -->

  <text x="600"
        y="55"
        text-anchor="middle"
        fill="#56edff"
        font-family="monospace"
        font-size="12"
        letter-spacing="5">

    SUBHAJIT SEN // SYSTEM ONLINE

  </text>


  <!-- NAME -->

  <text x="600"
        y="102"
        text-anchor="middle"
        fill="#ffffff"
        font-family="Arial, sans-serif"
        font-size="39"
        font-weight="700"
        letter-spacing="2">

    AI × SOFTWARE × WEB3

  </text>


  <text x="600"
        y="130"
        text-anchor="middle"
        fill="#71829d"
        font-family="monospace"
        font-size="12"
        letter-spacing="3">

    BUILDING INTELLIGENT SYSTEMS

  </text>


  <!-- ORBIT 1 -->

  <ellipse cx="600"
           cy="230"
           rx="280"
           ry="88"
           fill="none"
           stroke="url(#cyanLine)"
           stroke-width="1.5"
           opacity=".65">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 600 230"
      to="360 600 230"
      dur="14s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ORBIT 2 -->

  <ellipse cx="600"
           cy="230"
           rx="215"
           ry="65"
           fill="none"
           stroke="url(#purpleLine)"
           stroke-width="1"
           opacity=".7">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360 600 230"
      to="0 600 230"
      dur="10s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ORBIT 3 -->

  <ellipse cx="600"
           cy="230"
           rx="150"
           ry="45"
           fill="none"
           stroke="#00eaff"
           stroke-width="1"
           stroke-dasharray="4 9"
           opacity=".55">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 600 230"
      to="360 600 230"
      dur="7s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- NEURAL CONNECTIONS -->

  <g stroke="#00dfff"
     stroke-width="1"
     opacity=".35">

    <line x1="600" y1="230" x2="380" y2="170"/>
    <line x1="600" y1="230" x2="820" y2="170"/>
    <line x1="600" y1="230" x2="350" y2="300"/>
    <line x1="600" y1="230" x2="850" y2="300"/>

  </g>


  <!-- MOVING PARTICLE 1 -->

  <circle r="4"
          fill="#00eaff"
          filter="url(#glow)">

    <animateMotion
      path="M380,170 Q600,80 820,170 Q600,300 350,300"
      dur="6s"
      repeatCount="indefinite"/>

  </circle>


  <!-- MOVING PARTICLE 2 -->

  <circle r="3"
          fill="#ff4fd8"
          filter="url(#glow)">

    <animateMotion
      path="M820,170 Q600,360 350,300 Q600,100 820,170"
      dur="8s"
      repeatCount="indefinite"/>

  </circle>


  <!-- CORE -->

  <circle cx="600"
          cy="230"
          r="48"
          fill="url(#core)"
          opacity=".25"
          filter="url(#bigGlow)">

    <animate attributeName="r"
             values="42;58;42"
             dur="3s"
             repeatCount="indefinite"/>

  </circle>


  <circle cx="600"
          cy="230"
          r="32"
          fill="url(#core)"
          stroke="#7df7ff"
          stroke-width="1.5"
          filter="url(#glow)">

    <animate attributeName="r"
             values="28;35;28"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- CORE SYMBOL -->

  <text x="600"
        y="239"
        text-anchor="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="20"
        font-weight="700">

    AI

    <animate attributeName="opacity"
             values=".5;1;.5"
             dur="2s"
             repeatCount="indefinite"/>

  </text>


  <!-- NEURAL NODES -->

  <g fill="#00eaff"
     filter="url(#glow)">

    <circle cx="380" cy="170" r="5"/>
    <circle cx="820" cy="170" r="5"/>
    <circle cx="350" cy="300" r="5"/>
    <circle cx="850" cy="300" r="5"/>

  </g>


  <!-- SCANNING BEAM -->

  <rect x="180"
        y="150"
        width="840"
        height="2"
        fill="url(#cyanLine)"
        opacity=".65">

    <animate attributeName="y"
             values="145;315;145"
             dur="5s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values=".15;.8;.15"
             dur="5s"
             repeatCount="indefinite"/>

  </rect>


  <!-- LIVE TELEMETRY -->

  <text x="55"
        y="365"
        fill="#586b86"
        font-family="monospace"
        font-size="11">

    CORE_STATUS

  </text>

  <text x="55"
        y="385"
        fill="#50edff"
        font-family="monospace"
        font-size="11">

    ● ONLINE

  </text>


  <text x="330"
        y="365"
        fill="#586b86"
        font-family="monospace"
        font-size="11">

    INTELLIGENCE

  </text>

  <text x="330"
        y="385"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    GENAI / RAG / CV

  </text>


  <text x="650"
        y="365"
        fill="#586b86"
        font-family="monospace"
        font-size="11">

    ENGINEERING

  </text>

  <text x="650"
        y="385"
        fill="#ffffff"
        font-family="monospace"
        font-size="11">

    FULL-STACK / SYSTEMS

  </text>


  <text x="1000"
        y="365"
        text-anchor="end"
        fill="#586b86"
        font-family="monospace"
        font-size="11">

    TRUST_LAYER

  </text>

  <text x="1000"
        y="385"
        text-anchor="end"
        fill="#c58cff"
        font-family="monospace"
        font-size="11">

    BLOCKCHAIN / WEB3

  </text>


  <!-- FOOTER -->

  <text x="600"
        y="415"
        text-anchor="middle"
        fill="#3e506a"
        font-family="monospace"
        font-size="9"
        letter-spacing="3">

    SYSTEMS THAT EXTEND WHAT HUMANS CAN DO

  </text>

</svg>
