<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03040b"/><stop offset=".5" stop-color="#08122b"/><stop offset="1" stop-color="#16052c"/>
  </linearGradient>
  <radialGradient id="glowC"><stop stop-color="#00e5ff" stop-opacity=".55"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowP"><stop stop-color="#a855f7" stop-opacity=".45"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse">
    <path d="M55 0H0V55" fill="none" stroke="#2b3a63" stroke-opacity=".28"/>
  </pattern>
  <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .title{font:800 56px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#f8fafc}
    .sub{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:4px;fill:#00e5ff}
    .stage{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#cbd5e1;letter-spacing:2px}
    .tiny{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94a3b8}
    .wire{fill:none;stroke:url(#neon);stroke-width:3;stroke-linecap:round}
    .particle{fill:#00e5ff}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    .float{animation:float 5s ease-in-out infinite}
    .scan{animation:scan 5s linear infinite}
    .blink{animation:blink 1.4s steps(2,end) infinite}
    @keyframes pulse{50%{opacity:.28;transform:scale(1.12)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes scan{0%{transform:translateY(-90px);opacity:0}20%,80%{opacity:.7}100%{transform:translateY(700px);opacity:0}}
    @keyframes blink{50%{opacity:.25}}
  </style>
</defs>

<rect width="1600" height="620" rx="26" fill="url(#bg)"/>
<rect width="1600" height="620" rx="26" fill="url(#grid)"/>
<ellipse cx="420" cy="150" rx="360" ry="170" fill="url(#glowC)" filter="url(#blur)"/>
<ellipse cx="1220" cy="420" rx="400" ry="200" fill="url(#glowP)" filter="url(#blur)"/>

<!-- ambient particles -->
<g opacity=".75">
 <circle cx="90" cy="100" r="3" class="particle pulse"/><circle cx="150" cy="480" r="2" fill="#a855f7"/>
 <circle cx="280" cy="90" r="2" fill="#ec4899"/><circle cx="530" cy="500" r="3" fill="#00e5ff"/>
 <circle cx="710" cy="120" r="2" fill="#8b5cf6"/><circle cx="890" cy="500" r="2" fill="#00e5ff"/>
 <circle cx="1090" cy="90" r="3" fill="#ec4899"/><circle cx="1320" cy="510" r="2" fill="#00e5ff"/>
 <circle cx="1490" cy="130" r="3" fill="#8b5cf6"/>
</g>

<!-- scan beam -->
<rect x="0" y="0" width="1600" height="5" fill="#00e5ff" opacity=".65" filter="url(#soft)" class="scan"/>

<!-- top HUD -->
<g class="mono">
 <text x="70" y="58" class="tiny">EVOLUTION_PROTOCOL // 2026</text>
 <text x="1350" y="58" class="tiny">SYSTEM: <tspan fill="#22c55e">ONLINE</tspan></text>
</g>

<!-- evolution path -->
<path d="M165 350 C360 255 470 445 650 350 S960 250 1120 350 S1380 410 1460 275" class="wire" opacity=".65"/>
<path d="M165 350 C360 255 470 445 650 350 S960 250 1120 350 S1380 410 1460 275" class="wire" stroke-dasharray="9 16" opacity=".45">
  <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3s" repeatCount="indefinite"/>
</path>

<!-- stages: stylized silhouettes / icons -->
<g class="float">
 <!-- ape -->
 <g transform="translate(140 300)">
  <circle cx="42" cy="24" r="19" fill="#475569"/><circle cx="30" cy="18" r="7" fill="#64748b"/><circle cx="54" cy="18" r="7" fill="#64748b"/>
  <path d="M28 45 Q10 70 22 98 M57 45 Q78 67 69 97 M32 48 Q43 72 58 48" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="35" cy="23" r="3" fill="#00e5ff"/><circle cx="49" cy="23" r="3" fill="#00e5ff"/>
 </g>
 <!-- human -->
 <g transform="translate(430 300)">
  <circle cx="43" cy="20" r="18" fill="#cbd5e1"/><path d="M43 42V91M17 61L43 52L69 61M27 112L43 91L59 112" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>
  <circle cx="37" cy="19" r="2.5" fill="#8b5cf6"/><circle cx="49" cy="19" r="2.5" fill="#8b5cf6"/>
 </g>
 <!-- engineer -->
 <g transform="translate(715 295)">
  <circle cx="43" cy="18" r="17" fill="#f1f5f9"/><path d="M25 41H61V82H25Z" fill="#334155"/><path d="M10 108L25 82H61L76 108" fill="#1e293b"/>
  <rect x="29" y="50" width="28" height="17" rx="2" fill="#00e5ff" opacity=".75"/><path d="M34 56h18M34 61h12" stroke="#07111f" stroke-width="2"/>
  <path d="M69 55h15M76 48v15" stroke="#ec4899" stroke-width="3"/>
 </g>
 <!-- robot -->
 <g transform="translate(1010 295)">
  <rect x="17" y="12" width="54" height="42" rx="10" fill="#94a3b8" stroke="#00e5ff" stroke-width="3"/>
  <circle cx="33" cy="33" r="5" fill="#00e5ff"/><circle cx="55" cy="33" r="5" fill="#ec4899"/>
  <path d="M44 12V0" stroke="#8b5cf6" stroke-width="4"/><circle cx="44" cy="0" r="5" fill="#8b5cf6"/>
  <rect x="25" y="59" width="38" height="43" rx="8" fill="#64748b"/><path d="M25 68L7 85M63 68L81 85M35 102L26 119M53 102L62 119" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
 </g>
 <!-- brain -->
 <g transform="translate(1315 245)" class="pulse">
  <path d="M65 20C45 5 20 17 22 38C3 43 8 68 25 74C19 94 40 108 57 97C68 116 96 108 98 89C119 87 123 58 104 48C106 28 86 15 65 20Z" fill="#d946ef" opacity=".92"/>
  <path d="M62 25C50 42 73 48 57 61C45 70 68 76 55 93M76 26C92 42 69 53 87 63C99 70 78 80 92 94" fill="none" stroke="#f5d0fe" stroke-width="4" opacity=".75"/>
 </g>
</g>

<!-- labels -->
<g class="mono" text-anchor="middle">
 <text x="182" y="455" class="stage">INSTINCT</text><text x="182" y="478" class="tiny">SURVIVAL</text>
 <text x="472" y="455" class="stage">KNOWLEDGE</text><text x="472" y="478" class="tiny">HUMAN INTELLIGENCE</text>
 <text x="758" y="455" class="stage">CREATION</text><text x="758" y="478" class="tiny">ENGINEERING</text>
 <text x="1054" y="455" class="stage">AUTOMATION</text><text x="1054" y="478" class="tiny">ARTIFICIAL INTELLIGENCE</text>
 <text x="1370" y="455" class="stage">AUGMENTATION</text><text x="1370" y="478" class="tiny">HUMAN × AI</text>
</g>

<!-- identity -->
<text x="800" y="135" text-anchor="middle" class="title">SUBHAJIT SEN</text>
<text x="800" y="172" text-anchor="middle" class="sub">AI × CODE × WEB3</text>
<text x="800" y="555" text-anchor="middle" class="tiny">BUILDING SYSTEMS THAT EXTEND WHAT HUMANS CAN DO <tspan class="blink">▌</tspan></text>
</svg>