    </text>

    <text x="25"
          y="220"
          fill="#667892"
          font-family="monospace"
          font-size="11">
      DIGITAL OWNERSHIP
    </text>

    <circle cx="270" cy="225" r="25"
            fill="none"
            stroke="#7f91ff"
            opacity=".25"/>

    <circle cx="270" cy="225" r="5"
            fill="#7f91ff"
            filter="url(#glow)"/>

  </g>

  <!-- BOTTOM LINE -->
  <line x1="60"
        y1="480"
        x2="1140"
        y2="480"
        stroke="#26364c"/>

  <text x="60"
        y="505"
        fill="#52627a"
        font-family="monospace"
        font-size="11">
    MORE SYSTEMS IN DEVELOPMENT...
  </text>

</svg>
